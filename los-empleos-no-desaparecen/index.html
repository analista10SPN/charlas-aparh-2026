<style>

<script>
  // Clickers de presentación: PageDown/PageUp -> siguiente/anterior.
  window.addEventListener("keydown", function (e) {
    var key = { PageDown: "ArrowRight", PageUp: "ArrowLeft", ArrowDown: "ArrowRight", ArrowUp: "ArrowLeft" }[e.key];
    if (!key) return;
    e.preventDefault();
    e.stopPropagation();
    document.querySelector("hyperframes-slideshow").dispatchEvent(new KeyboardEvent("keydown", { key: key, bubbles: true, cancelable: true }));
  }, true);
  document.querySelector("hyperframes-slideshow").focus();
</script>
</body>
